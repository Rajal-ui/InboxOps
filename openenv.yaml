spec_version: 1
name: inboxops
version: "1.0.0"
type: space
runtime: fastapi
app: server.app:app
port: 7860
description: "Deterministic inbox operations benchmark with three graded tasks."
entrypoint: server.app:app
tasks:
  - id: task_easy
    name: "Password Reset Routing"
    task_id: task_easy
    difficulty: easy
    urgency: low
    compliance_risk: low
    business_impact: low
    tags: ["identity", "routing", "service-desk"]
    expected_action: route_it
    max_reward: 0.92
    grader: server.task_graders:EasyGrader
  - id: task_medium
    name: "Payroll Approval Incident"
    task_id: task_medium
    difficulty: medium
    urgency: high
    compliance_risk: low
    business_impact: medium
    tags: ["finance", "deadline", "escalation"]
    expected_action: escalate
    max_reward: 0.97
    grader: server.task_graders:MediumGrader
  - id: task_hard
    name: "Mailbox Retention Hold"
    task_id: task_hard
    difficulty: hard
    urgency: medium
    compliance_risk: high
    business_impact: medium
    tags: ["legal", "retention", "compliance"]
    expected_action: reply_with_template
    max_reward: 0.96
    grader: server.task_graders:HardGrader
grader: server.task_graders:MultiGrader
