[project]
name = "inboxops"
version = "0.1.0"
description = "Minimal deterministic OpenEnv environment for InboxOps."
requires-python = ">=3.11"
dependencies = [
  "openenv-core>=0.2.0,<0.3.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "openai>=2.7.2,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
]

[project.scripts]
inboxops = "inboxops.app:main"

[tool.setuptools]
packages = ["inboxops"]


[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
